name: Mutation
on:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rate-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --python 3.15.2
      - name: Verify runtime
        run: .venv/bin/python -c 'import sys; print(sys.version); assert sys.version_info[:3] == (3, 15, 2)'
      - name: Mutate rate contracts
        run: >-
          uv run --no-sync pytest tests/test_rate_metamorphic.py tests/test_cost_properties.py
          --gremlins --gremlin-targets=src/polars_rates.py
          --gremlin-report=console,json --gremlin-executor=subprocess
          --gremlin-workers=2 --gremlin-mutant-timeout=30 --gremlin-coverage-timeout=120
          --strict-pardons --max-pardons=0
          --disable-socket --allow-unix-socket --timeout=120 -q
      - name: Enforce mutation floor and complete execution
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          score = json.loads(Path("coverage/gremlins/gremlins.json").read_text())["summary"]
          print(score)
          assert score["total"] >= 42, "Mutation discovery unexpectedly shrank"
          assert score["percentage"] >= 95, "Mutation score below 95%"
          assert score["error"] == score["timeout"] == score["pardoned"] == 0
          PY
      - name: Retain mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rate-mutation
          path: coverage/gremlins/gremlins.json
          if-no-files-found: error
          retention-days: 14
