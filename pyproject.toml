[tool.ruff]
line-length = 88


[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.format]
quote-style = "double"


[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.1"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version"
]



[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microcosting-healthworkforce"
license = "Apache-2.0"
license-files = ["LICENSE"]
version = "0.0.1"
requires-python = "==3.15.2"
dependencies = [
    "pydantic>=2.14.3,<3",
    "pandera[polars]",
    "openpyxl",
    "polars",
    "numpy",
    "matplotlib",
    "pyarrow",
]

[project.scripts]
microcosting-healthworkforce = "src.main:main"
microcosting-healthworkforce-v2 = "src.conditions_cli:main"

[tool.setuptools]
packages = ["src"]

[dependency-groups]
profiling = ["scalene"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff>=0.17.4",
    "basedpyright",
    "hypothesis",
    "pytest-gremlins",
    "bandit",
    "sphinx",
    "furo",
    "myst-parser",
    "commitizen",
    "pytest-timeout>=2.4.0",
    "pytest-socket>=0.8.1",
    "pre-commit>=4.7.0",
]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.15"
include = ["src", "tests"]
