repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (locked Python 3.15.2 environment)
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: basedpyright
        name: Basedpyright strict
        entry: uv run --locked basedpyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: bandit
        name: Bandit
        entry: uv run --locked bandit -r src
        language: system
        pass_filenames: false
        types: [python]
        exclude: ^tests/
      - id: commitizen
        name: Commitizen
        entry: uv run --locked cz check --commit-msg-file
        language: system
        stages: [commit-msg]
