[tox]
isolated_build = true
envlist = py39, py310, py311

[testenv]
deps =
    pandas
    numpy
    openpyxl
    asteval
    pytest-cov
    pytest
    ruff
    mypy
    bandit
    exceptiongroup; python_version < "3.11"
    tomli; python_version < "3.11"
    matplotlib
    seaborn
commands =
    pytest --cov=src
    python -m cProfile -o profile.out src/main.py
    ruff format .
    ruff check .
    mypy
    bandit -r src
